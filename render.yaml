# Despliegue en Render como Blueprint. Ver la sección "Despliegue" del README.
services:
  - type: web
    name: cartero-mailing
    runtime: node
    plan: free
    region: virginia # junto al clúster de MongoDB Atlas (AWS us-east-1)
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: MONGODB_DB
        value: mailing
      # Render gratis bloquea los puertos SMTP: la demo guarda los mails en
      # la base y los muestra en /bandeja.
      - key: MAIL_TRANSPORT
        value: outbox
      # Render inventa el secreto al crear el servicio.
      - key: JWT_SECRET
        generateValue: true
      # Secreto: no va en el repositorio. Render lo pide al crear el servicio.
      - key: MONGODB_URI
        sync: false
